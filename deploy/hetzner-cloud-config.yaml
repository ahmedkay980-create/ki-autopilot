#cloud-config
# KI-Autopilot – beim Erstellen des Hetzner-Servers unter „Cloud config“ komplett einfügen.
# NUR die Zeile mit dem Passwort ändern: mindestens 12 Zeichen, nur Buchstaben und Zahlen.
write_files:
  - path: /root/ki-autopilot-passwort
    permissions: '0600'
    content: |
      HierDeinPasswort2026
  - path: /root/ki-autopilot-setup.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      set -e
      REPO=https://github.com/ahmedkay980-create/ki-autopilot.git
      systemctl enable --now docker
      [ -d /opt/ki-autopilot ] || git clone --depth 50 "$REPO" /opt/ki-autopilot
      IP=$(curl -fsS http://169.254.169.254/hetzner/v1/metadata/public-ipv4 || curl -fsS https://api.ipify.org)
      DOMAIN="$(echo "$IP" | tr . -).sslip.io"
      PW=$(head -n1 /root/ki-autopilot-passwort | tr -d '[:space:]')
      printf 'APP_PASSWORD=%s\nDOMAIN=%s\n' "$PW" "$DOMAIN" > /opt/ki-autopilot/.env
      chmod 600 /opt/ki-autopilot/.env
      cd /opt/ki-autopilot && mkdir -p data && docker compose up -d --build
      echo "$(git rev-parse --short=7 HEAD) $(date '+%d.%m.%Y %H:%M')" > data/version.txt
      U=/opt/ki-autopilot/deploy/update.sh
      L=/var/log/ki-autopilot-update.log
      printf '30 3 * * * root %s >> %s 2>&1\n*/5 * * * * root [ -f /opt/ki-autopilot/data/update-request ] && rm -f /opt/ki-autopilot/data/update-request && %s >> %s 2>&1\n' "$U" "$L" "$U" "$L" > /etc/cron.d/ki-autopilot
      echo "KI-Autopilot: https://$DOMAIN" > /etc/motd
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - curl
runcmd:
  - [bash, /root/ki-autopilot-setup.sh]
