<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zurück zur App – KI-Autopilot</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #eef0f6; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a.btn { display: inline-block; margin-top: 16px; background: #8b7cff; color: #0d0b1f; font-weight: 700; padding: 14px 22px; border-radius: 14px; text-decoration: none; }
  p { color: #9aa3b8; max-width: 34ch; margin: 8px auto 0; }
</style>
</head>
<body>
<main>
  <h1>Fast geschafft</h1>
  <p id="msg">Du wirst zurück zur KI-Autopilot-App geleitet …</p>
  <a class="btn" id="back" href="#">Zurück zur App</a>
</main>
<script>
  // Leitet die Antwort von Google bzw. TikTok (code, state) unverändert an die App weiter.
  var q = location.search || '';
  var app = 'kiautopilot://oauth' + q;
  var intent = 'intent://oauth' + q + '#Intent;scheme=kiautopilot;package=de.achmo.kiautopilot;end';
  var isAndroid = /Android/i.test(navigator.userAgent);
  var target = isAndroid ? intent : app;
  document.getElementById('back').href = target;
  if (/error=/.test(q) && !/code=/.test(q)) document.getElementById('msg').textContent = 'Die Anmeldung wurde abgebrochen. Tippe auf den Knopf, um zur App zurückzukehren.';
  setTimeout(function () { location.href = target; }, 300);
</script>
</body>
</html>
